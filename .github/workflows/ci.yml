name: CI

on:
  push:
    branches: [main, dev, "feat/*", "fix/*"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ─── Backend: lint + type-check ──────────────────────────────────
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check app/ tests/

      - name: Ruff format check
        run: uv run ruff format --check app/ tests/

      - name: Mypy
        run: uv run mypy app/ --strict --ignore-missing-imports

  # ─── Backend: tests ──────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: freela
          POSTGRES_PASSWORD: freela_test_pw
          POSTGRES_DB: freela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U freela"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "postgresql+asyncpg://freela:freela_test_pw@localhost:5432/freela_test"
      REDIS_URL: "redis://localhost:6379/0"
      JWT_SECRET: "ci-test-secret-not-real-32chars!!"
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRES_MINUTES: "60"
      ENVIRONMENT: "test"
      ENV: "dev"
      DB_ENCRYPTION_KEY: "ci-test-encryption-key-32chars!!"
      S3_ENDPOINT_URL: "http://localhost:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET: "test-bucket"
      S3_PUBLIC_BASE_URL: "http://localhost:9000/test-bucket"
      CORS_ORIGINS: "http://localhost:3000"
      BCRYPT_ROUNDS: "4"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run alembic upgrade head

      # S3 de teste via moto (Python, do PyPI): as imagens públicas do MinIO
      # deixaram de existir (minio/minio saiu do Docker Hub e quay.io/minio/minio
      # passou a exigir login). Versão fixada; o processo segue vivo nos próximos steps.
      - name: Start S3 (moto server) with public-read bucket
        run: |
          nohup uvx --from "moto[server]==5.2.3" moto_server -H 127.0.0.1 -p 9000 \
            > "$RUNNER_TEMP/moto.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9000/ > /dev/null || { cat "$RUNNER_TEMP/moto.log"; exit 1; }
          uv run python - <<'PY'
          import json, os
          import boto3
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT_URL"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["S3_SECRET_KEY"],
              region_name="us-east-1",
          )
          bucket = os.environ["S3_BUCKET"]
          s3.create_bucket(Bucket=bucket)
          s3.put_bucket_policy(Bucket=bucket, Policy=json.dumps({
              "Version": "2012-10-17",
              "Statement": [{
                  "Effect": "Allow",
                  "Principal": {"AWS": ["*"]},
                  "Action": ["s3:GetObject"],
                  "Resource": [f"arn:aws:s3:::{bucket}/*"],
              }],
          }))
          print(f"bucket {bucket} ready (public-read)")
          PY

      - name: Run tests
        run: uv run pytest -x --tb=short -q

  # ─── Frontend: lint + build ──────────────────────────────────────
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
